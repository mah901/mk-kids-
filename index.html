<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MK Kids</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3a5f">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MK Kids">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f5f9;color:#1d2433}
header{background:#1f3a5f;color:#fff;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
header h1{margin:0;font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
nav button{background:transparent;border:0;color:#cfd9e8;padding:8px 14px;cursor:pointer;font-size:15px;border-radius:6px;font-family:inherit}
nav button.on{background:#fff;color:#1f3a5f;font-weight:bold}
nav select{width:auto;margin-inline-start:8px}
main{max-width:1100px;margin:18px auto;padding:0 14px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stat b{display:block;font-size:22px;margin-top:6px;color:#1f3a5f}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;text-align:right;border-bottom:1px solid #e5e9f0;font-size:14px}
th{background:#f3f5f9}
input,select{padding:8px;border:1px solid #c5cdd9;border-radius:6px;font-family:inherit;font-size:14px;width:100%}
label{font-size:13px;color:#566;display:block;margin:8px 0 3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
button.b{background:#1f3a5f;color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px}
button.b:disabled{opacity:.5;cursor:wait}
button.g{background:#2e8b57}button.r{background:#c0392b}button.s{background:#6b7a90}
button.sm{padding:4px 10px;font-size:12px}
.low{color:#c0392b;font-weight:bold}
.cx td{opacity:.5;text-decoration:line-through}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;background:#e8eef7;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px}
pre{background:#10151f;color:#d7e3f4;padding:12px;border-radius:8px;overflow:auto;direction:ltr;text-align:left;font-size:12px;white-space:pre}
ol li{margin-bottom:8px;line-height:1.7}
code{background:#eef1f6;padding:1px 5px;border-radius:4px;direction:ltr;unicode-bidi:embed}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);overflow:auto;padding:20px;z-index:9}
#modal .box{background:#fff;max-width:760px;margin:0 auto;padding:24px;border-radius:10px;position:relative}
.stamp{position:absolute;top:40%;left:25%;font-size:64px;color:rgba(192,57,43,.25);transform:rotate(-20deg);font-weight:bold;pointer-events:none}
.inv-head{display:flex;justify-content:space-between;border-bottom:2px solid #1f3a5f;padding-bottom:10px;margin-bottom:14px}
.inv-head h2{margin:0;color:#1f3a5f}
.tot{margin-top:12px;margin-right:auto;width:260px}
.tot div{display:flex;justify-content:space-between;padding:4px 0}
.tot .grand{font-weight:bold;font-size:17px;border-top:2px solid #1f3a5f}
.act{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
@media(max-width:640px){input,select{font-size:16px}th,td{padding:7px 5px}main{padding:0 8px}.stat b{font-size:19px}}
@page{size:A4;margin:12mm}
@media print{
 header,main,.act{display:none!important}
 html,body{background:#fff!important;height:auto!important}
 #modal{position:static!important;display:block!important;background:#fff!important;padding:0!important;overflow:visible!important}
 #modal .box{box-shadow:none!important;max-width:none!important;margin:0!important;padding:0!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header><div class="top"><h1 id="brand"></h1><div id="who"></div></div><nav id="nav"></nav></header>
<main id="app"></main>
<div id="modal"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =====================================================
   الإعداد: الصق هنا بيانات مشروع Firebase (شوف شاشة الإعداد)
   ===================================================== */
const FB_CONFIG={apiKey:"AIzaSyCj732ngmhbs-iEuH8Rdwe-xK3c7Q43RNc",authDomain:"mk-kids.firebaseapp.com",projectId:"mk-kids",storageBucket:"mk-kids.firebasestorage.app",messagingSenderId:"531851369478",appId:"1:531851369478:web:7df0e2b34c551c1abf7787"};
const ADMIN_EMAIL="men69429@gmail.com";   // بريد حساب الإدارة (الجهاز الرئيسي)
/* ===================================================== */

const CONFIGURED=!!(FB_CONFIG.apiKey&&FB_CONFIG.projectId&&ADMIN_EMAIL);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const fmt=d=>{const x=new Date(d);return x.toLocaleDateString('en-GB')+' '+x.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};
const DEF={name:'MK Kids',address:'',phone:'',tax:'',currency:'$',vat:0};

let auth,db,me=null,authReady=false,loginMsg='';
let S={settings:{...DEF},branches:{},cur:null},D={},U=[];
let tab='dash',cart=[],cust='',disc=0,editId=null,q='',period='month',mvf='all',dirty=false;
let unsubs=[],bunsubs=[],subKey='';

const money=n=>num(n)+' '+esc(S.settings.currency);
const isAdmin=()=>!!me&&me.role==='admin';
const P=b=>(D[b]&&D[b].products)||[];
const I=b=>(D[b]&&D[b].invoices)||[];
const E=b=>(D[b]&&D[b].expenses)||[];
const EM=b=>(D[b]&&D[b].employees)||[];
const PR=b=>(D[b]&&D[b].payroll)||[];
const pad2=n=>String(n).padStart(2,'0');
const ymOf=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const dshort=d=>new Date(d).toLocaleDateString('en-GB');
const CATS=['إيجار','كهرباء وماء','اتصالات وإنترنت','نقل وشحن','صيانة','تسويق وإعلان','مستلزمات تشغيل','ضرائب ورسوم','أخرى'];
let editEmp=null,payFor=null;
const bname=id=>(S.branches[id]&&S.branches[id].name)||id;
const byName=(a,b)=>String(a.name).localeCompare(String(b.name),'ar');

/* ---------- أخطاء ---------- */
function errMsg(e){
 const c=(e&&e.code)||'';
 if(c.includes('permission-denied'))return 'ليس لديك صلاحية لهذه العملية';
 if(c.includes('unavailable')||c.includes('network'))return 'لا يوجد اتصال بالإنترنت، حاول مرة ثانية';
 return (e&&e.message)||'حدث خطأ';
}
function authErr(x){
 const c=(x&&x.code)||'';
 if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c))return 'البريد أو كلمة السر غير صحيحة';
 if(c==='auth/too-many-requests')return 'محاولات كثيرة، انتظر قليلاً ثم حاول';
 if(c==='auth/network-request-failed')return 'لا يوجد اتصال بالإنترنت';
 if(c==='auth/weak-password')return 'كلمة السر ضعيفة (6 أحرف على الأقل)';
 if(c==='auth/operation-not-supported-in-this-environment')return 'افتح البرنامج من رابط الموقع (https) وليس من الملف مباشرة';
 return x&&x.message||'حدث خطأ';
}
const fire=p=>p.catch(e=>alert(errMsg(e)));

/* ---------- الدخول والاشتراك بالبيانات ---------- */
function stopAll(){
 unsubs.forEach(f=>f());bunsubs.forEach(f=>f());
 unsubs=[];bunsubs=[];subKey='';D={};U=[];S.branches={};S.cur=null;
}
async function onAuth(u){
 authReady=true;stopAll();
 if(!u){me=null;render();return}
 const email=(u.email||'').toLowerCase();
 if(email===ADMIN_EMAIL.toLowerCase()){me={email,role:'admin'}}
 else{
  let d=null;
  try{d=await db.doc('users/'+email).get()}catch(e){}
  if(!d||!d.exists||!d.data().branch){loginMsg='حسابك غير مرتبط بأي فرع. تواصل مع الإدارة.';await auth.signOut();return}
  me={email,role:'branch',branch:d.data().branch};
 }
 loginMsg='';tab='dash';
 startListeners();render();
}
function startListeners(){
 const lerr=e=>console.error(e);
 unsubs.push(db.doc('settings/company').onSnapshot(s=>{if(s.exists)S.settings={...DEF,...s.data()};refresh()},lerr));
 if(isAdmin()){
  db.collection('branches').get({source:'server'}).then(s=>{if(s.empty)return seed()}).catch(()=>{});
  db.doc('settings/company').get({source:'server'}).then(s=>{if(!s.exists)return db.doc('settings/company').set(DEF)}).catch(()=>{});
  unsubs.push(db.collection('branches').onSnapshot(s=>{
   S.branches={};s.forEach(d=>S.branches[d.id]={id:d.id,...d.data()});
   const ids=Object.keys(S.branches).sort();
   if(!S.cur||!S.branches[S.cur])S.cur=ids[0]||null;
   subscribeBranches();refresh();
  },lerr));
  unsubs.push(db.collection('users').onSnapshot(s=>{U=s.docs.map(d=>({email:d.id,...d.data()}));if(tab==='set')refresh()},lerr));
 }else{
  S.cur=me.branch;
  unsubs.push(db.doc('branches/'+me.branch).onSnapshot(d=>{
   if(d.exists)S.branches={[d.id]:{id:d.id,...d.data()}};
   subscribeBranches();refresh();
  },lerr));
 }
}
function seed(){
 const b=db.batch();
 [1,2,3,4].forEach(n=>b.set(db.doc('branches/b'+n),{name:'الفرع '+n,prefix:String.fromCharCode(64+n),counter:1}));
 return b.commit();
}
function range(){
 if(period==='all')return [null,null];
 const n=new Date(),y=n.getFullYear(),m=n.getMonth();
 const cur=period==='month';
 return [new Date(y,cur?m:m-1,1).toISOString(),new Date(y,cur?m+1:m,1).toISOString()];
}
function mrange(){
 if(period==='all')return [null,null];
 const n=new Date(),y=n.getFullYear(),m=n.getMonth(),cur=period==='month';
 return [ymOf(new Date(y,cur?m:m-1,1)),ymOf(new Date(y,cur?m+1:m,1))];
}
function subscribeBranches(){
 const ids=Object.keys(S.branches).sort();
 const key=ids.join(',')+'|'+period;
 if(key===subKey)return;
 subKey=key;bunsubs.forEach(f=>f());bunsubs=[];
 const [from,to]=range(),[fm,tm]=mrange(),lerr=e=>console.error(e);
 ids.forEach(id=>{
  D[id]=D[id]||{products:[],invoices:[],moves:[],expenses:[],employees:[],payroll:[]};
  bunsubs.push(db.collection(`branches/${id}/products`).onSnapshot(s=>{D[id].products=s.docs.map(x=>({id:x.id,...x.data()})).sort(byName);refresh()},lerr));
  let iq=db.collection(`branches/${id}/invoices`);
  if(from)iq=iq.where('date','>=',from);
  if(to)iq=iq.where('date','<',to);
  bunsubs.push(iq.onSnapshot(s=>{D[id].invoices=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>b.date.localeCompare(a.date));refresh()},lerr));
  bunsubs.push(db.collection(`branches/${id}/moves`).orderBy('date','desc').limit(150).onSnapshot(s=>{D[id].moves=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},lerr));
  let eq=db.collection(`branches/${id}/expenses`);
  if(from)eq=eq.where('date','>=',from);
  if(to)eq=eq.where('date','<',to);
  bunsubs.push(eq.onSnapshot(s=>{D[id].expenses=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},lerr));
  if(isAdmin()){
   let pq=db.collection(`branches/${id}/payroll`);
   if(fm)pq=pq.where('month','>=',fm);
   if(tm)pq=pq.where('month','<',tm);
   bunsubs.push(pq.onSnapshot(s=>{D[id].payroll=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},lerr));
   bunsubs.push(db.collection(`branches/${id}/employees`).onSnapshot(s=>{D[id].employees=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},lerr));
  }
 });
}
async function login(){
 const e=document.getElementById('le').value.trim(),p=document.getElementById('lp').value;
 loginMsg='';
 try{await auth.signInWithEmailAndPassword(e,p)}catch(x){loginMsg=authErr(x);render()}
}
async function resetPw(){
 const el=document.getElementById('le');const e=el?el.value.trim():me.email;
 if(!e)return alert('اكتب بريدك الإلكتروني أولاً');
 try{await auth.sendPasswordResetEmail(e);alert('تم إرسال رابط تغيير كلمة السر إلى '+e)}catch(x){alert(authErr(x))}
}
function logout(){auth.signOut()}

/* ---------- العرض ---------- */
function refresh(){
 const a=document.activeElement,app=document.getElementById('app');
 if(a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName)&&app.contains(a)){dirty=true;return}
 render();
}
document.addEventListener('focusout',()=>setTimeout(()=>{
 if(!dirty)return;
 const a=document.activeElement;
 if(a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName)&&document.getElementById('app').contains(a))return;
 render();
},60));
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;render()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;render()});
async function installApp(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;render()}
function installHint(){
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent||'');
 const sa=navigator.standalone===true||(typeof matchMedia==='function'&&matchMedia('(display-mode: standalone)').matches);
 if(sa)return '';
 if(ios)return '<p style="font-size:13px;color:#566;margin-top:14px">لتثبيت التطبيق على الآيفون: اضغط زر المشاركة في Safari ثم <b>إضافة إلى الشاشة الرئيسية</b>.</p>';
 if(deferredInstall)return '<div class="act"><button class="b" onclick="installApp()">تثبيت التطبيق على الجهاز</button></div>';
 return '';
}
window.addEventListener('online',()=>render());
window.addEventListener('offline',()=>render());

function tabsList(){
 const t=[['dash','لوحة التحكم'],['sales','بيع جديد'],['stock','المخزون'],['inv','الفواتير'],['exp','المصاريف'],['moves','الحركات']];
 if(isAdmin())t.push(['emp','الموظفون والرواتب'],['all','كل الفروع']);
 t.push(['set',isAdmin()?'الإعدادات':'الحساب']);
 return t;
}
function plain(title){
 document.getElementById('brand').textContent=title;
 document.getElementById('nav').innerHTML='';document.getElementById('who').innerHTML='';
}
function render(){
 dirty=false;
 const app=document.getElementById('app');
 if(!CONFIGURED){plain('برنامج المحاسبة والمخزون');return setupView()}
 if(typeof firebase==='undefined'){plain('برنامج المحاسبة والمخزون');app.innerHTML='<div class="card low">تعذر تحميل Firebase. تأكد من اتصال الإنترنت ثم حدّث الصفحة.</div>';return}
 if(!authReady){plain('برنامج المحاسبة والمخزون');app.innerHTML='<div class="card">جاري التحميل...</div>';return}
 if(!me)return loginView();
 const tl=tabsList();if(!tl.some(t=>t[0]===tab))tab='dash';
 document.getElementById('brand').textContent=S.settings.name+(S.cur?' — '+bname(S.cur):'');
 document.title=S.settings.name;
 let nav=tl.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 if(isAdmin())nav+=`<select title="الفرع" onchange="switchBr(this.value)">${Object.keys(S.branches).sort().map(id=>`<option value="${id}" ${id==S.cur?'selected':''}>${esc(bname(id))}</option>`).join('')}</select>`;
 nav+=`<select title="الفترة" onchange="setPeriod(this.value)"><option value="month" ${period=='month'?'selected':''}>هذا الشهر</option><option value="prev" ${period=='prev'?'selected':''}>الشهر الماضي</option><option value="all" ${period=='all'?'selected':''}>كل الفترة</option></select>`;
 document.getElementById('nav').innerHTML=nav;
 document.getElementById('who').innerHTML=`<span style="font-size:13px"><span class="dot" style="background:${navigator.onLine?'#2ecc71':'#e74c3c'}"></span>${navigator.onLine?'متصل':'بدون إنترنت'} · ${esc(me.email)}</span> ${deferredInstall?'<button class="b g sm" onclick="installApp()">تثبيت التطبيق</button> ':''}<button class="b s sm" onclick="logout()">خروج</button>`;
 if(!S.cur||!S.branches[S.cur]){app.innerHTML='<div class="card">جاري تحميل البيانات...</div>';return}
 const v={dash,sales,stock,inv,moves,set,all:allv,exp:expView,emp:empView}[tab]||dash;
 app.innerHTML=v();
}
function go(t){tab=t;render()}
function switchBr(id){S.cur=id;cart=[];cust='';disc=0;editId=null;q='';render()}
function setPeriod(p){period=p;subscribeBranches();render()}
const periodLabel=()=>({month:'هذا الشهر',prev:'الشهر الماضي',all:'كل الفترة'}[period]);

function loginView(){
 plain('برنامج المحاسبة والمخزون');
 document.getElementById('app').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h3>تسجيل الدخول</h3>
 <form onsubmit="login();return false">
 <label>البريد الإلكتروني</label><input id="le" type="email" autocomplete="username" required>
 <label>كلمة السر</label><input id="lp" type="password" autocomplete="current-password" required>
 ${loginMsg?`<p class="low">${esc(loginMsg)}</p>`:''}
 <div class="act"><button class="b g" type="submit">دخول</button><button type="button" class="b s" onclick="resetPw()">نسيت كلمة السر</button></div></form>${installHint()}</div>`;
}

/* ---------- لوحة التحكم ---------- */
function stats(bid){
 const inv=I(bid).filter(i=>!i.cancelled);
 const total=inv.reduce((a,i)=>a+i.total,0);
 const profit=inv.reduce((a,i)=>a+i.items.reduce((x,l)=>x+(l.price-l.cost)*l.qty,0)-i.discount,0);
 const val=P(bid).reduce((a,p)=>a+p.qty*p.cost,0);
 const low=P(bid).filter(p=>p.qty<=p.min);
 const exp=E(bid).reduce((a,x)=>a+(+x.amount||0),0);
 const sal=isAdmin()?PR(bid).reduce((a,x)=>a+(+x.net||0),0):0;
 return {inv,total,profit,val,low,count:inv.length,exp,sal,net:profit-exp-sal};
}
function dash(){
 const s=stats(S.cur);
 return `<div class="grid">
 <div class="stat">المبيعات (${periodLabel()})<b>${money(s.total)}</b></div>
 <div class="stat">الربح من المبيعات<b>${money(s.profit)}</b></div>
 <div class="stat">المصاريف<b>${money(s.exp)}</b></div>
 ${isAdmin()?`<div class="stat">الرواتب<b>${money(s.sal)}</b></div>
 <div class="stat">صافي الربح<b style="color:${s.net<0?'#c0392b':'#2e8b57'}">${money(s.net)}</b></div>`:''}
 <div class="stat">قيمة المخزون (بسعر التكلفة)<b>${money(s.val)}</b></div>
 <div class="stat">عدد الفواتير<b>${s.count}</b></div></div>
 <div class="card" style="margin-top:16px"><h3>أصناف قاربت على النفاد</h3>
 ${s.low.length?`<table><tr><th>الصنف</th><th>المتوفر</th><th>حد التنبيه</th></tr>${s.low.map(p=>`<tr><td>${esc(p.name)}</td><td class="low">${num(p.qty)}</td><td>${num(p.min)}</td></tr>`).join('')}</table>`:'<p>لا يوجد أصناف ناقصة.</p>'}</div>`;
}

/* ---------- حركات المخزون ---------- */
function log(w,bid,type,name,qty,note){
 w.set(db.collection(`branches/${bid}/moves`).doc(),{date:new Date().toISOString(),type,name,qty,note:note||'',by:me.email,branch:bid});
}
const TYPES={sale:'بيع',add:'إضافة كمية',new:'صنف جديد',edit:'تعديل صنف',del:'حذف صنف',cancel:'إلغاء فاتورة'};
function moves(){
 const ids=isAdmin()?Object.keys(S.branches).sort():[S.cur];
 let list=[];
 ids.forEach(id=>((D[id]&&D[id].moves)||[]).forEach(m=>{if(!isAdmin()||mvf==='all'||mvf===id)list.push({...m,bid:id})}));
 list.sort((a,b)=>b.date.localeCompare(a.date));list=list.slice(0,200);
 return `<div class="card"><h3>سجل الحركات (آخر ${list.length})</h3>

/* ---------- المبيعات ---------- */
function calc(){
 const sub=cart.reduce((a,l)=>a+l.qty*l.price,0);
 const after=Math.max(0,sub-disc);
 const tax=after*(S.settings.vat||0)/100;
 return {sub,tax,total:after+tax};
}
function sales(){
 const prods=P(S.cur);
 const opts=prods.map(p=>`<option value="${p.id}">${esc(p.name)} — متوفر: ${num(p.qty)}</option>`).join('');
 const c=calc();
 return `<div class="card"><h3>فاتورة بيع جديدة — ${esc(bname(S.cur))}</h3>
 ${prods.length?`<div class="row">
  <div><label>الصنف</label><select id="sp">${opts}</select></div>
  <div><label>الكمية</label><input id="sq" type="number" min="0" step="any" value="1"></div>
  <div><button class="b" onclick="addLine()">إضافة للفاتورة</button></div></div>`:'<p>أضف أصنافاً في تبويب المخزون أولاً.</p>'}
 </div>
 <div class="card">
 <table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>المجموع</th><th></th></tr>
 ${cart.map((l,i)=>`<tr><td>${esc(l.name)}</td>
  <td><input type="number" step="any" min="0" value="${l.qty}" style="width:90px" onchange="setLine(${i},'qty',this.value)"></td>
  <td><input type="number" step="any" min="0" value="${l.price}" style="width:110px" onchange="setLine(${i},'price',this.value)"></td>
  <td>${money(l.qty*l.price)}</td>
  <td><button class="b r sm" onclick="cart.splice(${i},1);render()">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">الفاتورة فارغة</td></tr>'}
 </table>
 <div class="row" style="margin-top:14px">
  <div><label>اسم الزبون</label><input id="cu" value="${esc(cust)}" onchange="cust=this.value"></div>
  <div><label>الخصم</label><input type="number" min="0" step="any" value="${disc}" onchange="disc=+this.value||0;render()"></div></div>
 <div class="tot"><div><span>المجموع</span><span>${money(c.sub)}</span></div>
  <div><span>الخصم</span><span>${money(disc)}</span></div>
  ${S.settings.vat?`<div><span>الضريبة (${num(S.settings.vat)}%)</span><span>${money(c.tax)}</span></div>`:''}
  <div class="grand"><span>الإجمالي</span><span>${money(c.total)}</span></div></div>
 <div class="act"><button id="fbtn" class="b g" onclick="finish()">حفظ وإصدار الفاتورة</button><button class="b s" onclick="cart=[];cust='';disc=0;render()">تفريغ</button></div></div>`;
}
function addLine(){
 const p=P(S.cur).find(x=>x.id==document.getElementById('sp').value);
 const qty=+document.getElementById('sq').value;
 if(!p||!(qty>0))return alert('اختر صنفاً وكمية صحيحة');
 const ex=cart.find(l=>l.pid==p.id);
 if(ex)ex.qty+=qty;else cart.push({pid:p.id,name:p.name,qty,price:p.price,cost:p.cost});
 render();
}
function setLine(i,k,v){cart[i][k]=+v||0;render()}
async function finish(){
 const cu=document.getElementById('cu');if(cu)cust=cu.value;
 if(!cart.length)return alert('الفاتورة فارغة');
 const bid=S.cur,items=cart.map(l=>({...l})),c=calc(),dsc=disc,customer=(cust||'').trim()||'زبون نقدي';
 const btn=document.getElementById('fbtn');if(btn)btn.disabled=true;
 try{
  const inv=await db.runTransaction(async t=>{
   const bref=db.doc('branches/'+bid);
   const bd=(await t.get(bref)).data();
   const no=bd.counter||1,pre=bd.prefix||'';
   const reads=[];
   for(const l of items){
    const r=db.doc(`branches/${bid}/products/${l.pid}`);
    const s=await t.get(r);
    if(!s.exists)throw new Error('الصنف "'+l.name+'" لم يعد موجوداً');
    if(l.qty>s.data().qty)throw new Error('الكمية المطلوبة من "'+l.name+'" أكبر من المتوفر ('+s.data().qty+')');
    reads.push([r,s.data().qty,l]);
   }
   reads.forEach(([r,q0,l])=>{t.update(r,{qty:q0-l.qty});log(t,bid,'sale',l.name,-l.qty,'فاتورة '+pre+no)});
   t.update(bref,{counter:no+1});
   const iref=db.collection(`branches/${bid}/invoices`).doc();
   const data={no,pre,branch:bd.name,date:new Date().toISOString(),customer,items,discount:dsc,vat:S.settings.vat||0,subtotal:c.sub,tax:c.tax,total:c.total,company:{...S.settings},by:me.email,cancelled:false};
   t.set(iref,data);
   return {id:iref.id,...data};
  });
  cart=[];cust='';disc=0;render();showInv(inv);
 }catch(e){if(btn)btn.disabled=false;alert(errMsg(e))}
}

function saveProd(){
 const g=id=>document.getElementById(id).value;
 const name=g('pn').trim();if(!name)return alert('اكتب اسم الصنف');
 const d={name,code:g('pc').trim(),cost:+g('pcost')||0,price:+g('pp')||0,qty:+g('pq')||0,min:+g('pm')||0};
 const bid=S.cur,col=db.collection(`branches/${bid}/products`),b=db.batch();
 if(editId){
  const old=P(bid).find(p=>p.id==editId)||{qty:0};
  b.update(col.doc(editId),d);log(b,bid,'edit',d.name,d.qty-(old.qty||0),'تعديل صنف');
 }else{
  b.set(col.doc(),d);log(b,bid,'new',d.name,d.qty,'صنف جديد');
 }
 editId=null;render();fire(b.commit());
}
function addStock(id){
 const p=P(S.cur).find(x=>x.id==id);if(!p)return;
 const n=parseFloat(prompt('الكمية المراد إضافتها للمخزون لـ '+p.name));
 if(!(n>0))return;
 const b=db.batch();
 b.update(db.doc(`branches/${S.cur}/products/${id}`),{qty:firebase.firestore.FieldValue.increment(n)});
 log(b,S.cur,'add',p.name,n,'إضافة كمية');
 fire(b.commit());
}
function delProd(id){
 const p=P(S.cur).find(x=>x.id==id);if(!p)return;
 if(!confirm('حذف الصنف "'+p.name+'"؟'))return;

 b.delete(db.doc(`branches/${S.cur}/products/${id}`));
 log(b,S.cur,'del',p.name,-p.qty,'حذف صنف');
 fire(b.commit());
}

async function cancelInv(bid,id){
 if(!confirm('إلغاء الفاتورة؟ الكميات سترجع لمخزون الفرع، وتبقى الفاتورة في السجل كملغاة.'))return;
 try{
  await db.runTransaction(async t=>{
   const iref=db.doc(`branches/${bid}/invoices/${id}`);
   const is=await t.get(iref);
   if(!is.exists)throw new Error('الفاتورة غير موجودة');
   const inv=is.data();
   if(inv.cancelled)throw new Error('الفاتورة ملغاة مسبقاً');
   const reads=[];
   for(const l of inv.items){const r=db.doc(`branches/${bid}/products/${l.pid}`);reads.push([r,await t.get(r),l])}
   reads.forEach(([r,s,l])=>{
    if(s.exists)t.update(r,{qty:s.data().qty+l.qty});
    log(t,bid,'cancel',l.name,l.qty,'إلغاء فاتورة '+(inv.pre||'')+inv.no);
   });
   t.update(iref,{cancelled:true,cancelledBy:me.email,cancelledAt:new Date().toISOString()});
  });
 }catch(e){alert(errMsg(e))}
}

function payEmp(){
 const g=id=>document.getElementById(id).value;
 const bid=S.cur,e=EM(bid).find(x=>x.id==g('pe'));
 if(!e)return alert('اختر موظفاً');
 const month=g('pmn');if(!month)return alert('اختر الشهر');

 if(!(net>0))return alert('صافي المبلغ يجب أن يكون أكبر من صفر');
 const prev=PR(bid).filter(p=>p.empId===e.id&&p.month===month).reduce((a,p)=>a+(+p.net||0),0);
 if(!confirm('صرف '+num(net)+' '+S.settings.currency+' للموظف '+e.name+' عن شهر '+month+'؟'+(prev?'\nتنبيه: تم صرف '+num(prev)+' لنفس الشهر سابقاً.':'')))return;
 const [fm,tm]=mrange();
 fire(db.collection(`branches/${bid}/payroll`).add({date:new Date().toISOString(),month,empId:e.id,name:e.name,base,bonus,deduction:ded,net,note:g('pno').trim(),by:me.email,branch:bid}));
 payFor=null;
 if(fm&&(month<fm||month>=tm))alert('تم الصرف، لكنه عن شهر خارج الفترة المعروضة. غيّر الفترة من الأعلى لتراه.');
}

 if(confirm('حذف صرف راتب '+p.name+' عن '+p.month+' بمبلغ '+num(p.net)+'؟'))fire(db.doc(`branches/${S.cur}/payroll/${id}`).delete());

/* ---------- كل الفروع ---------- */
function allv(){
 const ids=Object.keys(S.branches).sort();
 let tot=0,pr=0,val=0,cnt=0,lw=0,te=0,ts=0,tn=0;
 const rows=ids.map(id=>{
  const s=stats(id);tot+=s.total;pr+=s.profit;val+=s.val;cnt+=s.count;lw+=s.low.length;te+=s.exp;ts+=s.sal;tn+=s.net;
  return `<tr><td>${esc(bname(id))}</td><td>${s.count}</td><td>${money(s.total)}</td><td>${money(s.profit)}</td><td>${money(s.exp)}</td><td>${money(s.sal)}</td><td style="color:${s.net<0?'#c0392b':'#2e8b57'}"><b>${money(s.net)}</b></td><td>${money(s.val)}</td><td class="${s.low.length?'low':''}">${s.low.length}</td></tr>`}).join('');
 const cm={};ids.forEach(id=>E(id).forEach(x=>{(cm[x.category]=cm[x.category]||{})[id]=(cm[x.category][id]||0)+(+x.amount||0)}));
 const map={};
 ids.forEach(id=>P(id).forEach(p=>{const k=p.name.trim().toLowerCase();(map[k]=map[k]||{name:p.name,q:{}}).q[id]=p}));
 const items=Object.values(map).sort(byName);
 return `<div class="card"><h3>مقارنة الفروع (${periodLabel()})</h3><table><tr><th>الفرع</th><th>الفواتير</th><th>المبيعات</th><th>الربح من المبيعات</th><th>المصاريف</th><th>الرواتب</th><th>صافي الربح</th><th>قيمة المخزون</th><th>أصناف ناقصة</th></tr>${rows}
 <tr><th>الإجمالي</th><th>${cnt}</th><th>${money(tot)}</th><th>${money(pr)}</th><th>${money(te)}</th><th>${money(ts)}</th><th style="color:${tn<0?'#c0392b':'#2e8b57'}">${money(tn)}</th><th>${money(val)}</th><th>${lw}</th></tr></table></div>
 <div class="card"><h3>المصاريف حسب النوع (${periodLabel()})</h3><table><tr><th>النوع</th>${ids.map(id=>`<th>${esc(bname(id))}</th>`).join('')}<th>المجموع</th></tr>
 ${Object.keys(cm).sort().map(c=>`<tr><td>${esc(c)}</td>${ids.map(id=>`<td>${cm[c][id]?money(cm[c][id]):'—'}</td>`).join('')}<td><b>${money(ids.reduce((a,id)=>a+(cm[c][id]||0),0))}</b></td></tr>`).join('')||`<tr><td colspan="${ids.length+2}">لا توجد مصاريف</td></tr>`}</table></div>
 <div class="card"><h3>المخزون في كل الفروع</h3><table><tr><th>الصنف</th>${ids.map(id=>`<th>${esc(bname(id))}</th>`).join('')}<th>المجموع</th></tr>
 ${items.map(it=>`<tr><td>${esc(it.name)}</td>${ids.map(id=>{const p=it.q[id];return p?`<td class="${p.qty<=p.min?'low':''}">${num(p.qty)}</td>`:'<td>—</td>'}).join('')}<td><b>${num(ids.reduce((a,id)=>a+(it.q[id]?it.q[id].qty:0),0))}</b></td></tr>`).join('')||`<tr><td colspan="${ids.length+2}">لا يوجد أصناف</td></tr>`}</table></div>`;
}

/* ---------- الإعدادات / الحساب ---------- */
function set(){
 const acct=`<div class="card"><h3>حسابي</h3><p>${esc(me.email)} ${isAdmin()?'<span class="pill">إدارة</span>':'<span class="pill">'+esc(bname(me.branch))+'</span>'}</p>
 <div class="act"><button class="b s" onclick="resetPw()">إرسال رابط تغيير كلمة السر لبريدي</button><button class="b r" onclick="logout()">تسجيل الخروج</button></div></div>`;
 if(!isAdmin())return acct;
 const s=S.settings,ids=Object.keys(S.branches).sort();
 return `<div class="card"><h3>بيانات الشركة (تظهر على الفاتورة)</h3><div class="row">
 <div><label>اسم الشركة</label><input id="sn" value="${esc(s.name)}"></div>
 <div><label>العنوان</label><input id="sa" value="${esc(s.address)}"></div>
 <div><label>الهاتف</label><input id="sph" value="${esc(s.phone)}"></div>
 <div><label>الرقم الضريبي</label><input id="st" value="${esc(s.tax)}"></div>
 <div><label>العملة</label><input id="sc" value="${esc(s.currency)}"></div>
 <div><label>نسبة الضريبة %</label><input id="sv" type="number" step="any" value="${s.vat}"></div>

 <div><button class="b g" onclick="saveBr()">حفظ الفروع</button></div></div></div>
 <div class="card"><h3>مستخدمو الفروع</h3>

 <table><tr><th>البريد</th><th>الفرع</th><th></th></tr>
 ${U.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(bname(u.branch))}</td><td><button class="b r sm" onclick="rmUser('${esc(u.email)}')">سحب الصلاحية</button></td></tr>`).join('')||'<tr><td colspan="3">لا يوجد مستخدمون بعد</td></tr>'}</table>
 <div class="row" style="margin-top:12px">
  <div><label>بريد المستخدم</label><input id="ue" type="email"></div>
  <div><label>كلمة سر (6 أحرف فأكثر)</label><input id="up" type="text"></div>
  <div><label>الفرع</label><select id="ub">${ids.map(id=>`<option value="${id}">${esc(bname(id))}</option>`).join('')}</select></div>
  <div><button class="b g" onclick="addUser()">إضافة مستخدم</button></div></div></div>
 <div class="card"><h3>نسخ احتياطي واستيراد</h3>
 <div class="act"><button class="b" onclick="backup()">تنزيل نسخة احتياطية (الفترة المعروضة)</button>

function saveSet(){
 const g=id=>document.getElementById(id).value;
 const d={name:g('sn').trim()||'شركتي',address:g('sa'),phone:g('sph'),tax:g('st'),currency:g('sc')||'$',vat:+g('sv')||0};
 fire(db.doc('settings/company').set(d).then(()=>alert('تم الحفظ')));
}
function saveBr(){
 const b=db.batch();
 Object.keys(S.branches).forEach(id=>b.update(db.doc('branches/'+id),{name:document.getElementById('bn_'+id).value.trim()||id,prefix:document.getElementById('bp_'+id).value.trim()}));
 fire(b.commit().then(()=>alert('تم الحفظ')));
}
async function addUser(){
 const e=document.getElementById('ue').value.trim().toLowerCase(),p=document.getElementById('up').value,br=document.getElementById('ub').value;
 if(!e||!p)return alert('اكتب البريد وكلمة السر');
 if(e===ADMIN_EMAIL.toLowerCase())return alert('هذا بريد الإدارة');
 try{
  const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FB_CONFIG,'sec');
  try{await sec.auth().createUserWithEmailAndPassword(e,p);await sec.auth().signOut()}
  catch(x){if(x.code!=='auth/email-already-in-use')throw x}
  await db.doc('users/'+e).set({email:e,branch:br});
  document.getElementById('ue').value='';document.getElementById('up').value='';
  alert('تمت الإضافة. أعطِ المستخدم البريد وكلمة السر ليدخل من جهازه.');
 }catch(x){alert(authErr(x))}
}
function rmUser(e){if(confirm('سحب صلاحية '+e+'؟'))fire(db.doc('users/'+e).delete())}
function backup(){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify({settings:S.settings,branches:S.branches,data:D})],{type:'application/json'}));
 a.download='backup-online-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
async function legacyImport(f){
 if(!f)return;
 let d;try{d=JSON.parse(await f.text())}catch(e){return alert('ملف غير صالح')}
 const ids=Object.keys(S.branches).sort(),sets=[];
 if(Array.isArray(d.branches))d.branches.forEach((b,i)=>{if(ids[i]&&b&&b.products)sets.push([ids[i],b])});
 else if(d.products)sets.push([S.cur,d]);
 if(!sets.length)return alert('ملف غير صالح');
 const sum=sets.map(([id,b])=>bname(id)+': '+(b.products||[]).length+' صنف، '+(b.invoices||[]).length+' فاتورة').join('\n');
 if(!confirm('سيتم استيراد:\n'+sum+'\nمتابعة؟'))return;
 const ops=[];
 for(const [id,b] of sets){
  (b.products||[]).forEach(p=>ops.push(w=>w.set(db.doc(`branches/${id}/products/${p.id}`),{name:p.name,code:p.code||'',cost:+p.cost||0,price:+p.price||0,qty:+p.qty||0,min:+p.min||0})));
  (b.invoices||[]).forEach(i=>ops.push(w=>w.set(db.doc(`branches/${id}/invoices/${i.id}`),{...i,pre:i.pre??(S.branches[id].prefix||''),branch:i.branch||bname(id),cancelled:false,by:me.email})));
  ops.push(w=>w.update(db.doc('branches/'+id),{counter:Math.max(+b.counter||1,S.branches[id].counter||1)}));
 }
 try{
  for(let k=0;k<ops.length;k+=400){const bt=db.batch();ops.slice(k,k+400).forEach(o=>o(bt));await bt.commit()}
  alert('تم الاستيراد');
 }catch(e){alert(errMsg(e))}
}

/* ---------- شاشة الإعداد الأول ---------- */
function rulesText(em){return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function mail(){ return request.auth.token.email.lower(); }
    function isAdmin(){ return request.auth != null && mail() == '${em.toLowerCase()}'; }
    function inBranch(b){
      return request.auth != null && (isAdmin() ||
        (exists(/databases/$(database)/documents/users/$(mail())) &&
         get(/databases/$(database)/documents/users/$(mail())).data.branch == b));
    }
    match /settings/{d} {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }
    match /users/{e} {
      allow read: if request.auth != null && (isAdmin() || mail() == e);
      allow write: if isAdmin();
    }
    match /branches/{b} {
      allow read: if inBranch(b);
      allow create, delete: if isAdmin();
      allow update: if isAdmin() || (inBranch(b) &&
        request.resource.data.diff(resource.data).affectedKeys().hasOnly(['counter']));
      match /products/{p} { allow read, write: if inBranch(b); }
      match /invoices/{i} {
        allow read, create: if inBranch(b);
        allow update: if isAdmin();
      }
      match /moves/{m} { allow read, create: if inBranch(b); }
      match /expenses/{e} {
        allow read, create: if inBranch(b);
        allow update, delete: if isAdmin();
      }
      match /employees/{e} { allow read, write: if isAdmin(); }
      match /payroll/{p} { allow read, write: if isAdmin(); }
    }
  }
}`}
