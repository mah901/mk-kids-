<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f5f9;color:#1d2433}
header{background:#1f3a5f;color:#fff;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
header h1{margin:0;font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
#who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
nav button{background:transparent;border:0;color:#cfd9e8;padding:8px 14px;cursor:pointer;font-size:15px;border-radius:6px;font-family:inherit}
nav button.on{background:#fff;color:#1f3a5f;font-weight:bold}
nav select{width:auto;margin-inline-start:8px}
select.lg{width:auto;padding:4px 6px}
main{max-width:1100px;margin:18px auto;padding:0 14px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stat b{display:block;font-size:22px;margin-top:6px;color:#1f3a5f}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;text-align:start;border-bottom:1px solid #e5e9f0;font-size:14px}
th{background:#f3f5f9}
input,select{padding:8px;border:1px solid #c5cdd9;border-radius:6px;font-family:inherit;font-size:14px;width:100%}
input:disabled{background:#eef1f6;color:#667}
label{font-size:13px;color:#566;display:block;margin:8px 0 3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
button.b{background:#1f3a5f;color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px}
button.b:disabled{opacity:.5;cursor:wait}
button.g{background:#2e8b57}button.r{background:#c0392b}button.s{background:#6b7a90}
button.sm{padding:4px 10px;font-size:12px}
.low{color:#c0392b;font-weight:bold}
.sub{font-size:12px;color:#566;margin-top:3px}
.cx td{opacity:.5;text-decoration:line-through}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;background:#e8eef7;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px}
.crow{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-bottom:6px;max-width:460px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);overflow:auto;padding:20px;z-index:9}
#modal .box{background:#fff;max-width:760px;margin:0 auto;padding:24px;border-radius:10px;position:relative}
#modal .box.small{max-width:380px}
#modal .box.rcpt{max-width:340px;padding:14px}
.stamp{position:absolute;top:40%;left:25%;font-size:64px;color:rgba(192,57,43,.25);transform:rotate(-20deg);font-weight:bold;pointer-events:none}
.inv-head{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #1f3a5f;padding-bottom:10px;margin-bottom:14px}
.inv-head h2{margin:0;color:#1f3a5f}
.inv-meta{text-align:end}
.tot{margin-top:12px;margin-inline-start:auto;width:260px}
.tot div{display:flex;justify-content:space-between;padding:4px 0}
.tot .grand{font-weight:bold;font-size:17px;border-top:2px solid #1f3a5f}
.thanks{text-align:center;margin-top:30px;color:#566}
.act{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
.act select{width:auto}
/* إيصال حراري */
.rc{width:72mm;margin:0 auto;padding:3mm 0;color:#000;font-size:12px;line-height:1.4;font-family:Tahoma,Arial,sans-serif;position:relative}
.rc.w58{width:50mm;font-size:11px}
.rc .c{text-align:center}
.rc .big{font-size:17px;font-weight:bold}
.rc .xs{font-size:11px}
.rc hr{border:0;border-top:1px dashed #000;margin:6px 0}
.rc .kv{display:flex;justify-content:space-between;gap:6px}
.rc .it{margin:5px 0}
.rc .it .nm{font-weight:bold;word-break:break-word}
.rc .it .mt{font-size:11px}
.rc .it .ln{display:flex;justify-content:space-between;gap:6px}
.rc .gt{font-size:15px;font-weight:bold}
.rc .stamp{font-size:34px;left:10%;top:35%}
@media(max-width:640px){input,select{font-size:16px}th,td{padding:7px 5px}main{padding:0 8px}.stat b{font-size:19px}}
@media print{
 header,main,.act{display:none!important}
 html,body{background:#fff!important;height:auto!important;margin:0!important}
 #modal{position:static!important;display:block!important;background:#fff!important;padding:0!important;overflow:visible!important}
 #modal .box{box-shadow:none!important;max-width:none!important;margin:0!important;padding:0!important;border-radius:0!important;background:#fff!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

function tt(k,p){
 let s=L[lang]&&L[lang][k];
 if(s===undefined)s=L.ar[k];
 if(s===undefined)return k;
 if(p)for(const x in p)s=s.split('{'+x+'}').join(p[x]);
 return s;
}

applyLang();

 try{localStorage.setItem('mk_lang',v)}catch(e){}
 applyLang();render();
 if(curInv&&document.getElementById('modal').style.display==='block')showInv(curInv);else closeModal();

function errMsg(e){
 const c=(e&&e.code)||'';
 if(c.includes('permission-denied'))return tt('err.perm');
 if(c.includes('unavailable')||c.includes('network'))return tt('err.net');
 return (e&&e.message)||tt('err.gen');
}
function authErr(x){
 const c=(x&&x.code)||'';
 if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c))return tt('au.bad');
 if(c==='auth/too-many-requests')return tt('au.many');
 if(c==='auth/network-request-failed')return tt('au.net');
 if(c==='auth/weak-password')return tt('au.weak');
 if(c==='auth/operation-not-supported-in-this-environment')return tt('au.env');
 return (x&&x.message)||tt('err.gen');
}

function stopAll(){
 unsubs.forEach(f=>f());bunsubs.forEach(f=>f());
 unsubs=[];bunsubs=[];subKey='';D={};U=[];S.branches={};S.cur=null;
}
async function onAuth(u){
 authReady=true;stopAll();
 if(!u){me=null;render();return}
 const email=(u.email||'').toLowerCase();
 if(email===ADMIN_EMAIL.toLowerCase()){me={email,role:'admin'}}
 else{
  let d=null;
  try{d=await db.doc('users/'+email).get()}catch(e){}
  if(!d||!d.exists||!d.data().branch){loginMsg=tt('login.noBranch');await auth.signOut();return}
  me={email,role:'branch',branch:d.data().branch};
 }
 loginMsg='';tab='dash';
 startListeners();render();
}
function startListeners(){
 const lerr=e=>console.error(e);
 unsubs.push(db.doc('settings/company').onSnapshot(s=>{if(s.exists)S.settings={...DEF,...s.data()};refresh()},lerr));
 if(isAdmin()){
  db.collection('branches').get({source:'server'}).then(s=>{if(s.empty)return seed()}).catch(()=>{});
  db.doc('settings/company').get({source:'server'}).then(s=>{if(!s.exists)return db.doc('settings/company').set(DEF)}).catch(()=>{});
  unsubs.push(db.collection('branches').onSnapshot(s=>{
   S.branches={};s.forEach(d=>S.branches[d.id]={id:d.id,...d.data()});
   const ids=Object.keys(S.branches).sort();
   if(!S.cur||!S.branches[S.cur])S.cur=ids[0]||null;
   subscribeBranches();refresh();
  },lerr));
  unsubs.push(db.collection('users').onSnapshot(s=>{U=s.docs.map(d=>({email:d.id,...d.data()}));if(tab==='set')refresh()},lerr));
 }else{
  S.cur=me.branch;
  unsubs.push(db.doc('branches/'+me.branch).onSnapshot(d=>{
   if(d.exists)S.branches={[d.id]:{id:d.id,...d.data()}};
   subscribeBranches();refresh();
  },lerr));
 }
}
function seed(){
 const b=db.batch();
 [1,2,3,4].forEach(n=>b.set(db.doc('branches/b'+n),{name:'Branch '+n,prefix:String.fromCharCode(64+n),counter:1}));
 return b.commit();
}
function range(){
 if(period==='all')return [null,null];
 const n=new Date(),y=n.getFullYear(),m=n.getMonth();
 const cur=period==='month';
 return [new Date(y,cur?m:m-1,1).toISOString(),new Date(y,cur?m+1:m,1).toISOString()];
}
function mrange(){
 if(period==='all')return [null,null];
 const n=new Date(),y=n.getFullYear(),m=n.getMonth(),cur=period==='month';
 return [ymOf(new Date(y,cur?m:m-1,1)),ymOf(new Date(y,cur?m+1:m,1))];
}
function subscribeBranches(){
 const ids=Object.keys(S.branches).sort();
 const key=ids.join(',')+'|'+period;
 if(key===subKey)return;
 subKey=key;bunsubs.forEach(f=>f());bunsubs=[];
 const [from,to]=range(),[fm,tm]=mrange(),lerr=e=>console.error(e);
 ids.forEach(id=>{
  D[id]=D[id]||{products:[],invoices:[],moves:[],expenses:[],employees:[],payroll:[]};
  bunsubs.push(db.collection(`branches/${id}/products`).onSnapshot(s=>{D[id].products=s.docs.map(x=>({id:x.id,...x.data()})).sort(byName);refresh()},lerr));
  let iq=db.collection(`branches/${id}/invoices`);
  if(from)iq=iq.where('date','>=',from);
  if(to)iq=iq.where('date','<',to);
  bunsubs.push(iq.onSnapshot(s=>{D[id].invoices=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>b.date.localeCompare(a.date));refresh()},lerr));
  bunsubs.push(db.collection(`branches/${id}/moves`).orderBy('date','desc').limit(150).onSnapshot(s=>{D[id].moves=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},lerr));
  let eq=db.collection(`branches/${id}/expenses`);
  if(from)eq=eq.where('date','>=',from);
  if(to)eq=eq.where('date','<',to);
  bunsubs.push(eq.onSnapshot(s=>{D[id].expenses=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},lerr));
  if(isAdmin()){
   let pq=db.collection(`branches/${id}/payroll`);
   if(fm)pq=pq.where('month','>=',fm);
   if(tm)pq=pq.where('month','<',tm);
   bunsubs.push(pq.onSnapshot(s=>{D[id].payroll=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},lerr));
   bunsubs.push(db.collection(`branches/${id}/employees`).onSnapshot(s=>{D[id].employees=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},lerr));
  }
 });
}

function stats(bid){
 const inv=I(bid).filter(i=>!i.cancelled);
 const total=inv.reduce((a,i)=>a+i.total,0);
 const profit=inv.reduce((a,i)=>a+i.items.reduce((x,l)=>x+(l.price-l.cost)*l.qty,0)-i.discount,0);
 const val=P(bid).reduce((a,p)=>a+p.qty*p.cost,0);
 const low=P(bid).filter(p=>p.qty<=p.min);
 const exp=E(bid).reduce((a,x)=>a+(+x.amount||0),0);
 const sal=isAdmin()?PR(bid).reduce((a,x)=>a+(+x.net||0),0):0;
 return {inv,total,profit,val,low,count:inv.length,exp,sal,net:profit-exp-sal};
}

async function finish(){
 const cu=document.getElementById('cu');if(cu)cust=cu.value;
 if(!cart.length)return alert(tt('s.empty'));
 const bid=S.cur,items=cart.map(l=>({...l})),c=calc(),dsc=disc,customer=(cust||'').trim();
 const btn=document.getElementById('fbtn');if(btn)btn.disabled=true;
 try{
  const invoice=await db.runTransaction(async tx=>{
   const bref=db.doc('branches/'+bid);
   const bd=(await tx.get(bref)).data();
   const no=bd.counter||1,pre=bd.prefix||'';
   const groups={};items.forEach(l=>{(groups[l.pid]=groups[l.pid]||[]).push(l)});
   const snaps=[];
   for(const pid of Object.keys(groups)){
    const r=db.doc(`branches/${bid}/products/${pid}`);
    const s=await tx.get(r);
    if(!s.exists)throw new Error(tt('s.noItem',{n:groups[pid][0].name}));
    snaps.push([r,s.data(),groups[pid]]);
   }
   const writes=[];
   for(const [r,p,lines] of snaps){
    const colors=(p.colors||[]).map(x=>({n:x.n,q:+x.q||0}));
    let qty=+p.qty||0;
    for(const l of lines){
     if(colors.length){
      const col=colors.find(x=>x.n===(l.color||''));
      if(!col)throw new Error(tt('s.noColor',{n:l.name,c:l.color||'—'}));
      if(l.qty>col.q)throw new Error(tt('s.exceed',{n:l.name+(l.color?' — '+l.color:''),q:col.q}));
      col.q-=l.qty;
     }else{
      if(l.qty>qty)throw new Error(tt('s.exceed',{n:l.name,q:qty}));
      qty-=l.qty;
     }
    }
    writes.push([r,colors.length?{colors,qty:sumColors(colors)}:{qty},lines]);
   }
   writes.forEach(([r,upd,lines])=>{
    tx.update(r,upd);
    lines.forEach(l=>log(tx,bid,'sale',l.name,-l.qty,(pre+no)+(l.color?' · '+l.color:'')));
   });
   tx.update(bref,{counter:no+1});
   const iref=db.collection(`branches/${bid}/invoices`).doc();
   const data={no,pre,branch:bd.name,date:new Date().toISOString(),customer,items,discount:dsc,vat:S.settings.vat||0,subtotal:c.sub,tax:c.tax,total:c.total,company:{...S.settings},by:me.email,cancelled:false};
   tx.set(iref,data);
   return {id:iref.id,...data};
  });
  cart=[];cust='';disc=0;render();showInv(invoice);
 }catch(e){if(btn)btn.disabled=false;alert(errMsg(e))}
}

async function doAdd(id){
 const p=P(S.cur).find(x=>x.id==id);if(!p)return;
 const n=parseFloat(document.getElementById('aq').value);
 if(!(n>0))return alert(tt('add.bad'));
 const bid=S.cur,hasC=(p.colors||[]).length>0;
 try{
  if(!hasC){
   const b=db.batch();
   b.update(db.doc(`branches/${bid}/products/${id}`),{qty:firebase.firestore.FieldValue.increment(n)});
   log(b,bid,'add',p.name,n,'');
   await b.commit();
  }else{
   const sel=document.getElementById('ac').value;
   const cname=sel==='__new'?document.getElementById('acn').value.trim():sel;
   if(!cname)return alert(tt('f.colorNeedName'));
   await db.runTransaction(async tx=>{
    const r=db.doc(`branches/${bid}/products/${id}`);
    const s=await tx.get(r);if(!s.exists)throw new Error(tt('s.noItem',{n:p.name}));
    const colors=(s.data().colors||[]).map(x=>({n:x.n,q:+x.q||0}));
    const ex=colors.find(x=>x.n.toLowerCase()===cname.toLowerCase());
    if(ex)ex.q+=n;else colors.push({n:cname,q:n});
    tx.update(r,{colors,qty:sumColors(colors)});
    log(tx,bid,'add',p.name,n,cname);
   });
  }
  closeModal();
 }catch(e){alert(errMsg(e))}
}

async function cancelInv(bid,id){
 if(!confirm(tt('i.cancelConfirm')))return;
 try{
  await db.runTransaction(async tx=>{
   const iref=db.doc(`branches/${bid}/invoices/${id}`);
   const is=await tx.get(iref);
   if(!is.exists)throw new Error(tt('i.notFound'));
   const invoice=is.data();
   if(invoice.cancelled)throw new Error(tt('i.already'));
   const groups={};(invoice.items||[]).forEach(l=>{(groups[l.pid]=groups[l.pid]||[]).push(l)});
   const snaps=[];
   for(const pid of Object.keys(groups)){const r=db.doc(`branches/${bid}/products/${pid}`);snaps.push([r,await tx.get(r),groups[pid]])}
   const ref=(invoice.pre||'')+invoice.no;
   snaps.forEach(([r,s,lines])=>{
    if(s.exists){
     const p=s.data(),colors=(p.colors||[]).map(x=>({n:x.n,q:+x.q||0}));
     let qty=+p.qty||0;
     lines.forEach(l=>{
      if(colors.length){
       const nm=l.color||'—',ex=colors.find(x=>x.n===nm);
       if(ex)ex.q+=l.qty;else colors.push({n:nm,q:l.qty});
      }else qty+=l.qty;
     });
     tx.update(r,colors.length?{colors,qty:sumColors(colors)}:{qty});
    }
    lines.forEach(l=>log(tx,bid,'cancel',l.name,l.qty,ref+(l.color?' · '+l.color:'')));
   });
   tx.update(iref,{cancelled:true,cancelledBy:me.email,cancelledAt:new Date().toISOString()});
  });
 }catch(e){alert(errMsg(e))}
}

 <tr><th>${tt('th.total')}</th><th>${cnt}</th><th>${money(tot)}</th><th>${money(pr)}</th><th>${money(te)}</th><th>${money(ts)}</th><th style="color:${tn<0?'#c0392b':'#2e8b57'}">${money(tn)}</th><th>${money(val)}</th><th>${lw}</th></tr></table></div>
 <div class="card"><h3>${tt('a.cats',{p:periodLabel()})}</h3><table><tr><th>${tt('x.cat')}</th>${ids.map(id=>`<th>${esc(bname(id))}</th>`).join('')}<th>${tt('th.sum')}</th></tr>
 ${Object.keys(cm).sort().map(c=>`<tr><td>${esc(catName(c))}</td>${ids.map(id=>`<td>${cm[c][id]?money(cm[c][id]):'—'}</td>`).join('')}<td><b>${money(ids.reduce((a,id)=>a+(cm[c][id]||0),0))}</b></td></tr>`).join('')||`<tr><td colspan="${ids.length+2}">${tt('a.noExp')}</td></tr>`}</table></div>
 <div class="card"><h3>${tt('a.stock')}</h3><table><tr><th>${tt('th.item')}</th>${ids.map(id=>`<th>${esc(bname(id))}</th>`).join('')}<th>${tt('th.sum')}</th></tr>
 ${items.map(it=>`<tr><td>${esc(it.name)}</td>${ids.map(id=>{const p=it.q[id];return p?`<td class="${p.qty<=p.min?'low':''}">${num(p.qty)}</td>`:'<td>—</td>'}).join('')}<td><b>${num(ids.reduce((a,id)=>a+(it.q[id]?it.q[id].qty:0),0))}</b></td></tr>`).join('')||`<tr><td colspan="${ids.length+2}">${tt('a.noItems')}</td></tr>`}</table></div>`;
}

/* =====================  الإعدادات / الحساب  ===================== */
function setView(){
 const acct=`<div class="card"><h3>${tt('acct.title')}</h3><p>${esc(me.email)} ${isAdmin()?`<span class="pill">${tt('acct.admin')}</span>`:`<span class="pill">${esc(bname(me.branch))}</span>`}</p>
 <div class="act"><button class="b s" onclick="resetPw()">${tt('acct.reset')}</button><button class="b r" onclick="logout()">${tt('acct.logout')}</button></div></div>`;
 if(!isAdmin())return acct;
 const s=S.settings,ids=Object.keys(S.branches).sort();
 return `<div class="card"><h3>${tt('set.company')}</h3><div class="row">
 <div><label>${tt('set.cname')}</label><input id="sn" value="${esc(s.name)}"></div>
 <div><label>${tt('set.addr')}</label><input id="sa" value="${esc(s.address)}"></div>
 <div><label>${tt('set.phone')}</label><input id="sph" value="${esc(s.phone)}"></div>
 <div><label>${tt('set.taxno')}</label><input id="st" value="${esc(s.tax)}"></div>
 <div><label>${tt('set.cur')}</label><input id="sc" value="${esc(s.currency)}"></div>
 <div><label>${tt('set.vatp')}</label><input id="sv" type="number" step="any" value="${s.vat}"></div>
 <div><button class="b g" onclick="saveSet()">${tt('btn.save')}</button></div></div></div>
 <div class="card"><h3>${tt('set.branches')}</h3><div class="row">
 ${ids.map(id=>`<div><label>${tt('set.bname',{id})}</label><input id="bn_${id}" value="${esc(S.branches[id].name)}"></div><div><label>${tt('set.bprefix')}</label><input id="bp_${id}" value="${esc(S.branches[id].prefix)}" maxlength="4"></div>`).join('')}
 <div><button class="b g" onclick="saveBr()">${tt('set.saveBr')}</button></div></div></div>
 <div class="card"><h3>${tt('set.users')}</h3>
 <p style="font-size:13px;color:#566">${tt('set.usersHint')}</p>
 <table><tr><th>${tt('th.email')}</th><th>${tt('th.branch')}</th><th></th></tr>
 ${U.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(bname(u.branch))}</td><td><button class="b r sm" onclick="rmUser('${esc(u.email)}')">${tt('set.revoke')}</button></td></tr>`).join('')||`<tr><td colspan="3">${tt('set.noUsers')}</td></tr>`}</table>
 <div class="row" style="margin-top:12px">
  <div><label>${tt('set.uemail')}</label><input id="ue" type="email"></div>
  <div><label>${tt('set.upass')}</label><input id="up" type="text"></div>
  <div><label>${tt('th.branch')}</label><select id="ub">${ids.map(id=>`<option value="${id}">${esc(bname(id))}</option>`).join('')}</select></div>
  <div><button class="b g" onclick="addUser()">${tt('set.uadd')}</button></div></div></div>
 <div class="card"><h3>${tt('set.backup')}</h3>
 <div class="act"><button class="b" onclick="backup()">${tt('set.dl')}</button>
 <button class="b s" onclick="document.getElementById('lf').click()">${tt('set.import')}</button>
 <input type="file" id="lf" accept=".json" hidden onchange="legacyImport(this.files[0]);this.value=''"></div></div>
 ${acct}`;
}
function saveSet(){
 const g=id=>document.getElementById(id).value;
 const d={name:g('sn').trim()||'MK Kids',address:g('sa'),phone:g('sph'),tax:g('st'),currency:g('sc')||'$',vat:+g('sv')||0};
 fire(db.doc('settings/company').set(d).then(()=>alert(tt('set.saved'))));
}
function saveBr(){
 const b=db.batch();
 Object.keys(S.branches).forEach(id=>b.update(db.doc('branches/'+id),{name:document.getElementById('bn_'+id).value.trim()||id,prefix:document.getElementById('bp_'+id).value.trim()}));
 fire(b.commit().then(()=>alert(tt('set.saved'))));
}
async function addUser(){
 const e=document.getElementById('ue').value.trim().toLowerCase(),p=document.getElementById('up').value,br=document.getElementById('ub').value;
 if(!e||!p)return alert(tt('set.needEmailPass'));
 if(e===ADMIN_EMAIL.toLowerCase())return alert(tt('set.isAdminMail'));
 try{
  const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FB_CONFIG,'sec');
  try{await sec.auth().createUserWithEmailAndPassword(e,p);await sec.auth().signOut()}
  catch(x){if(x.code!=='auth/email-already-in-use')throw x}
  await db.doc('users/'+e).set({email:e,branch:br});
  document.getElementById('ue').value='';document.getElementById('up').value='';
  alert(tt('set.userAdded'));
 }catch(x){alert(authErr(x))}
}
function rmUser(e){if(confirm(tt('set.revokeConfirm',{e})))fire(db.doc('users/'+e).delete())}
function backup(){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify({settings:S.settings,branches:S.branches,data:D})],{type:'application/json'}));
 a.download='backup-online-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
async function legacyImport(f){
 if(!f)return;
 let d;try{d=JSON.parse(await f.text())}catch(e){return alert(tt('set.badFile'))}
 const ids=Object.keys(S.branches).sort(),sets=[];
 if(Array.isArray(d.branches))d.branches.forEach((b,i)=>{if(ids[i]&&b&&b.products)sets.push([ids[i],b])});
 else if(d.products)sets.push([S.cur,d]);
 if(!sets.length)return alert(tt('set.badFile'));
 const sum=sets.map(([id,b])=>tt('set.impLine',{b:bname(id),p:(b.products||[]).length,i:(b.invoices||[]).length})).join('\n');
 if(!confirm(tt('set.importConfirm',{s:sum})))return;
 const ops=[];
 for(const [id,b] of sets){
  (b.products||[]).forEach(p=>ops.push(w=>w.set(db.doc(`branches/${id}/products/${p.id}`),{name:p.name,code:p.code||'',cost:+p.cost||0,price:+p.price||0,qty:+p.qty||0,min:+p.min||0,colors:[]})));
  (b.invoices||[]).forEach(i=>ops.push(w=>w.set(db.doc(`branches/${id}/invoices/${i.id}`),{...i,pre:i.pre??(S.branches[id].prefix||''),branch:i.branch||bname(id),cancelled:false,by:me.email})));
  ops.push(w=>w.update(db.doc('branches/'+id),{counter:Math.max(+b.counter||1,S.branches[id].counter||1)}));
 }
 try{
  for(let k=0;k<ops.length;k+=400){const bt=db.batch();ops.slice(k,k+400).forEach(o=>o(bt));await bt.commit()}
  alert(tt('set.imported'));
 }catch(e){alert(errMsg(e))}
}

/* =====================  التشغيل  ===================== */
if(CONFIGURED&&typeof firebase!=='undefined'){
 firebase.initializeApp(FB_CONFIG);
 auth=firebase.auth();db=firebase.firestore();
 try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
 auth.onAuthStateChanged(onAuth);
}
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
