<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f5f9;color:#1d2433}
header{background:#1f3a5f;color:#fff;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
header h1{margin:0;font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
#who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
nav button{background:transparent;border:0;color:#cfd9e8;padding:8px 14px;cursor:pointer;font-size:15px;border-radius:6px;font-family:inherit}
nav button.on{background:#fff;color:#1f3a5f;font-weight:bold}
nav select{width:auto;margin-inline-start:8px}
select.lg{width:auto;padding:4px 6px}
main{max-width:1100px;margin:18px auto;padding:0 14px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stat b{display:block;font-size:22px;margin-top:6px;color:#1f3a5f}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;text-align:start;border-bottom:1px solid #e5e9f0;font-size:14px}
th{background:#f3f5f9}
input,select,textarea{padding:8px;border:1px solid #c5cdd9;border-radius:6px;font-family:inherit;font-size:14px;width:100%}
input:disabled{background:#eef1f6;color:#667}
label{font-size:13px;color:#566;display:block;margin:8px 0 3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
button.b{background:#1f3a5f;color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px}
button.b:disabled{opacity:.5;cursor:wait}
button.g{background:#2e8b57}button.r{background:#c0392b}button.s{background:#6b7a90}
button.sm{padding:4px 10px;font-size:12px}
.low{color:#c0392b;font-weight:bold}
.sub{font-size:12px;color:#566;margin-top:3px}
.cx td{opacity:.5;text-decoration:line-through}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;background:#e8eef7;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px}
.crow{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-bottom:6px;max-width:460px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);overflow:auto;padding:20px;z-index:9}
#modal .box{background:#fff;max-width:760px;margin:0 auto;padding:24px;border-radius:10px;position:relative}
#modal .box.small{max-width:380px}
#modal .box.rcpt{max-width:340px;padding:14px}
.stamp{position:absolute;top:40%;left:25%;font-size:64px;color:rgba(192,57,43,.25);transform:rotate(-20deg);font-weight:bold;pointer-events:none}
.inv-head{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #1f3a5f;padding-bottom:10px;margin-bottom:14px}
.inv-head h2{margin:0;color:#1f3a5f}
.inv-meta{text-align:end}
.tot{margin-top:12px;margin-inline-start:auto;width:260px}
.tot div{display:flex;justify-content:space-between;padding:4px 0}
.tot .grand{font-weight:bold;font-size:17px;border-top:2px solid #1f3a5f}
.thanks{text-align:center;margin-top:30px;color:#566}
.card ol{padding-inline-start:20px;line-height:1.8;margin:6px 0}
code{background:#eef1f6;padding:1px 5px;border-radius:4px;direction:ltr;unicode-bidi:embed}
#toasts{position:fixed;top:10px;left:10px;right:10px;z-index:99;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#1f3a5f;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:auto;font-size:15px;max-width:480px;margin:0 auto;width:100%}
.act{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
.act select{width:auto}
/* إيصال حراري */
.rc{width:72mm;margin:0 auto;padding:3mm 0;color:#000;font-size:12px;line-height:1.4;font-family:Tahoma,Arial,sans-serif;position:relative}
.rc.w58{width:50mm;font-size:11px}
.rc .c{text-align:center}
.rc .big{font-size:17px;font-weight:bold}
.rc .xs{font-size:11px}
.rc hr{border:0;border-top:1px dashed #000;margin:6px 0}
.rc .kv{display:flex;justify-content:space-between;gap:6px}
.rc .it{margin:5px 0}
.rc .it .nm{font-weight:bold;word-break:break-word}
.rc .it .mt{font-size:11px}
.rc .it .ln{display:flex;justify-content:space-between;gap:6px}
.rc .gt{font-size:15px;font-weight:bold}
.rc .pol{margin-top:6px;font-size:10.5px;line-height:1.35}
.rc .codebox{margin-top:8px}
.rc .stamp{font-size:34px;left:10%;top:35%}
@media(max-width:640px){input,select,textarea{font-size:16px}th,td{padding:7px 5px}main{padding:0 8px}.stat b{font-size:19px}}
@media print{
 .rpt table{font-size:11px}
 header,main,.act,#toasts{display:none!important}
 html,body{background:#fff!important;height:auto!important;margin:0!important}
 #modal{position:static!important;display:block!important;background:#fff!important;padding:0!important;overflow:visible!important}
 #modal .box{box-shadow:none!important;max-width:none!important;margin:0!important;padding:0!important;border-radius:0!important;background:#fff!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

 let s=L[lang]&&L[lang][k];

}

 if(c.includes('permission-denied'))return tt('err.perm');

 return (e&&e.message)||tt('err.gen');

function authErr(x){

 if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c))return tt('au.bad');

 return (x&&x.message)||tt('err.gen');

async function onAuth(u){
 authReady=true;stopAll();
 if(!u){me=null;render();return}
 const email=(u.email||'').toLowerCase();
 if(email===ADMIN_EMAIL.toLowerCase()){me={email,role:'admin'}}
 else{
  let d=null;
  try{d=await db.doc('users/'+email).get()}catch(e){}
  if(!d||!d.exists||!d.data().branch){loginMsg=tt('login.noBranch');await auth.signOut();return}
  me={email,role:'branch',branch:d.data().branch,name:d.data().name||''};
 }
 loginMsg='';tab='dash';
 startListeners();render();
}

function subscribeBranches(){
 const ids=Object.keys(S.branches).sort();
 const key=ids.join(',')+'|'+period;
 if(key===subKey)return;
 subKey=key;bunsubs.forEach(f=>f());bunsubs=[];
 const [from,to]=range(),[fm,tm]=mrange(),lerr=e=>console.error(e),dn=new Date(),dayStart=new Date(dn.getFullYear(),dn.getMonth(),dn.getDate()).toISOString();
 ids.forEach(id=>{

  let eq=db.collection(`branches/${id}/expenses`);

  bunsubs.push(eq.onSnapshot(s=>{D[id].expenses=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},lerr));
  if(isAdmin()){
   let pq=db.collection(`branches/${id}/payroll`);
   if(fm)pq=pq.where('month','>=',fm);
   if(tm)pq=pq.where('month','<',tm);
   bunsubs.push(pq.onSnapshot(s=>{D[id].payroll=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},lerr));
   let first=true;
   bunsubs.push(db.collection(`branches/${id}/invoices`).where('date','>=',dayStart).onSnapshot(s=>{
    if(first){s.docs.forEach(d=>seenSales.add(id+'/'+d.id));first=false;return}

   },lerr));
   bunsubs.push(db.collection(`branches/${id}/employees`).onSnapshot(s=>{D[id].employees=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},lerr));
  }
 });
}

function stats(bid){
 const inv=I(bid).filter(i=>!i.cancelled);
 const total=inv.reduce((a,i)=>a+i.total,0);
 const profit=inv.reduce((a,i)=>a+i.items.reduce((x,l)=>x+(l.price-l.cost)*l.qty,0)-i.discount,0);
 const val=P(bid).reduce((a,p)=>a+p.qty*p.cost,0);
 const low=P(bid).filter(p=>p.qty<=p.min);
 const exp=E(bid).reduce((a,x)=>a+(+x.amount||0),0);
 const sal=isAdmin()?PR(bid).reduce((a,x)=>a+(+x.net||0),0):0;
 const byPay={};inv.forEach(i=>{const k=i.pay||'none';byPay[k]=(byPay[k]||0)+i.total});
 return {inv,total,profit,val,low,count:inv.length,exp,sal,net:profit-exp-sal,byPay};
}

/* =====================  باركود Code128 و QR (مولّد داخلي)  ===================== */
const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128Widths(text){
 const vals=[104];
 for(const ch of text){const c=ch.charCodeAt(0);if(c<32||c>126)return null;vals.push(c-32)}
 let sum=104;for(let i=1;i<vals.length;i++)sum+=i*vals[i];
 vals.push(sum%103,106);
 const w=[];vals.forEach(v=>{for(const d of C128[v])w.push(+d)});
 return w;
}
function barcodeSVG(text,availMm){
 const w=code128Widths(text);if(!w)return '';
 const total=w.reduce((a,b)=>a+b,0),W=total+20,mod=Math.min(.5,availMm/W);
 let x=10,rects='';
 w.forEach((n,i)=>{if(i%2===0)rects+=`<rect x="${x}" y="0" width="${n}" height="1"/>`;x+=n});
 return `<svg viewBox="0 0 ${W} 1" preserveAspectRatio="none" shape-rendering="crispEdges" style="width:${(mod*W).toFixed(2)}mm;height:12mm;display:block;margin:0 auto" fill="#000">${rects}</svg>`;
}
/* ---------- QR (byte mode, ECC M, versions 1-4) ---------- */
const QR_V=[null,{n:26,ec:10,b:1},{n:44,ec:16,b:1},{n:70,ec:26,b:1},{n:100,ec:18,b:2}];
const QR_EXP=new Array(512),QR_LOG=new Array(256);
(function(){let x=1;for(let i=0;i<255;i++){QR_EXP[i]=x;QR_LOG[x]=i;x<<=1;if(x&256)x^=0x11d}for(let i=255;i<512;i++)QR_EXP[i]=QR_EXP[i-255]})();
const qrMul=(a,b)=>(a&&b)?QR_EXP[QR_LOG[a]+QR_LOG[b]]:0;
function qrRS(data,ec){
 let g=[1];
 for(let i=0;i<ec;i++){const n=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){n[j]^=g[j];n[j+1]^=qrMul(g[j],QR_EXP[i])}g=n}
 const r=new Array(ec).fill(0);
 for(const d of data){const f=d^r[0];r.shift();r.push(0);for(let j=0;j<ec;j++)r[j]^=qrMul(g[j+1],f)}
 return r;
}
function qrPenalty(m){
 const n=m.length;let p=0,dark=0;
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(m[r][c])dark++;
 for(let t=0;t<2;t++)for(let a=0;a<n;a++){
  let run=1;
  for(let b=1;b<=n;b++){
   const cur=b<n?(t?m[b][a]:m[a][b]):null,prev=t?m[b-1][a]:m[a][b-1];
   if(cur===prev)run++;else{if(run>=5)p+=3+run-5;run=1}
  }
  let s='';for(let b=0;b<n;b++)s+=(t?m[b][a]:m[a][b])?'1':'0';
  for(const pat of ['10111010000','00001011101']){let i=-1;while((i=s.indexOf(pat,i+1))>=0)p+=40}
 }
 for(let r=0;r<n-1;r++)for(let c=0;c<n-1;c++){const v=m[r][c];if(v===m[r][c+1]&&v===m[r+1][c]&&v===m[r+1][c+1])p+=3}
 const tot=n*n;p+=(Math.ceil(Math.abs(dark*20-tot*10)/tot)-1)*10;
 return p;
}
function qrMake(text){
 const bytes=Array.from(new TextEncoder().encode(text));
 let v=0;
 for(let k=1;k<=4;k++){if(bytes.length+2<=QR_V[k].n-QR_V[k].ec*QR_V[k].b){v=k;break}}
 if(!v)return null;
 const {n:tot,ec,b:nb}=QR_V[v],dataCw=tot-ec*nb,bits=[];
 const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>i)&1)};
 put(4,4);put(bytes.length,8);bytes.forEach(x=>put(x,8));
 const cap=dataCw*8;put(0,Math.min(4,cap-bits.length));
 while(bits.length%8)bits.push(0);
 for(let p=0;bits.length<cap;p^=1)put(p?0x11:0xEC,8);
 const data=[];for(let i=0;i<bits.length;i+=8){let x=0;for(let j=0;j<8;j++)x=(x<<1)|bits[i+j];data.push(x)}
 const bs=dataCw/nb,blocks=[],ecs=[];
 for(let i=0;i<nb;i++){const d=data.slice(i*bs,(i+1)*bs);blocks.push(d);ecs.push(qrRS(d,ec))}
 const cw=[];
 for(let i=0;i<bs;i++)blocks.forEach(b=>cw.push(b[i]));
 for(let i=0;i<ec;i++)ecs.forEach(e=>cw.push(e[i]));
 const all=[];cw.forEach(x=>{for(let i=7;i>=0;i--)all.push((x>>i)&1)});
 const size=17+4*v,m=[],fn=[];
 for(let i=0;i<size;i++){m.push(new Array(size).fill(false));fn.push(new Array(size).fill(false))}
 const setF=(r,c,val)=>{if(r<0||c<0||r>=size||c>=size)return;m[r][c]=!!val;fn[r][c]=true};
 const fp=(r0,c0)=>{for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const inside=dr>=0&&dr<=6&&dc>=0&&dc<=6;const d=Math.max(Math.abs(dr-3),Math.abs(dc-3));setF(r0+dr,c0+dc,inside&&(d===3||d<=1))}};
 fp(0,0);fp(0,size-7);fp(size-7,0);
 for(let i=8;i<size-8;i++){setF(6,i,i%2===0);setF(i,6,i%2===0)}
 if(v>=2){const a=4*v+10;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)setF(a+dr,a+dc,Math.max(Math.abs(dr),Math.abs(dc))!==1)}
 for(let i=0;i<9;i++){setF(8,i,false);setF(i,8,false)}
 for(let i=0;i<8;i++){setF(8,size-1-i,false);setF(size-1-i,8,false)}
 setF(size-8,8,true);
 let idx=0,up=true;
 for(let col=size-1;col>0;col-=2){
  if(col===6)col--;
  for(let k=0;k<size;k++){
   const r=up?size-1-k:k;
   for(let dc=0;dc<2;dc++){const c=col-dc;if(!fn[r][c]){m[r][c]=idx<all.length?all[idx]===1:false;idx++}}
  }
  up=!up;
 }
 const maskFn=[(r,c)=>(r+c)%2===0,(r,c)=>r%2===0,(r,c)=>c%3===0,(r,c)=>(r+c)%3===0,(r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0,(r,c)=>(r*c)%2+(r*c)%3===0,(r,c)=>((r*c)%2+(r*c)%3)%2===0,(r,c)=>((r+c)%2+(r*c)%3)%2===0];
 const withMask=k=>{
  const x=m.map(row=>row.slice());
  for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(!fn[r][c]&&maskFn[k](r,c))x[r][c]=!x[r][c];
  const d=k;let rem=d;for(let i=0;i<10;i++)rem=(rem<<1)^((rem>>>9)*0x537);
  const f=((d<<10)|rem)^0x5412,bit=i=>((f>>>i)&1)===1;
  for(let i=0;i<=5;i++)x[i][8]=bit(i);
  x[7][8]=bit(6);x[8][8]=bit(7);x[8][7]=bit(8);
  for(let i=9;i<15;i++)x[8][14-i]=bit(i);
  for(let i=0;i<8;i++)x[8][size-1-i]=bit(i);
  for(let i=8;i<15;i++)x[size-15+i][8]=bit(i);
  x[size-8][8]=true;
  return x;
 };
 let best=null,bp=1e9;
 for(let k=0;k<8;k++){const x=withMask(k),p=qrPenalty(x);if(p<bp){bp=p;best=x}}
 return best;
}
function qrSVG(text,sizeMm){
 const m=qrMake(text);if(!m)return '';
 const n=m.length,q=4;let d='';
 for(let r=0;r<n;r++){let c=0;while(c<n){if(m[r][c]){const s=c;while(c<n&&m[r][c])c++;d+=`M${s+q} ${r+q}h${c-s}v1h-${c-s}z`}else c++}}
 return `<svg viewBox="0 0 ${n+2*q} ${n+2*q}" shape-rendering="crispEdges" style="width:${sizeMm}mm;height:${sizeMm}mm;display:block;margin:0 auto"><path d="${d}" fill="#000"/></svg>`;
}

async function cancelInv(bid,id){
 if(!confirm(tt('i.cancelConfirm')))return;
 try{
  await db.runTransaction(async tx=>{
   const iref=db.doc(`branches/${bid}/invoices/${id}`);
   const is=await tx.get(iref);
   if(!is.exists)throw new Error(tt('i.notFound'));
   const invoice=is.data();
   if(invoice.cancelled)throw new Error(tt('i.already'));
   const groups={};(invoice.items||[]).forEach(l=>{(groups[l.pid]=groups[l.pid]||[]).push(l)});
   const snaps=[];
   for(const pid of Object.keys(groups)){const r=db.doc(`branches/${bid}/products/${pid}`);snaps.push([r,await tx.get(r),groups[pid]])}
   const ref=(invoice.pre||'')+invoice.no;
   snaps.forEach(([r,s,lines])=>{
    if(s.exists){
     const p=s.data(),colors=(p.colors||[]).map(x=>({n:x.n,q:+x.q||0}));
     let qty=+p.qty||0;
     lines.forEach(l=>{
      if(colors.length){
       const nm=l.color||'—',ex=colors.find(x=>x.n===nm);
       if(ex)ex.q+=l.qty;else colors.push({n:nm,q:l.qty});
      }else qty+=l.qty;
     });
     tx.update(r,colors.length?{colors,qty:sumColors(colors)}:{qty});
    }
    lines.forEach(l=>log(tx,bid,'cancel',l.name,l.qty,ref+(l.color?' · '+l.color:'')));
   });
   tx.update(iref,{cancelled:true,cancelledBy:me.email,cancelledAt:new Date().toISOString()});
  });
 }catch(e){alert(errMsg(e))}
}

function finCalc(){
 const ids=Object.keys(S.branches).sort(),ev=[];
 const open=+((S.settings.fin||{}).openCash)||0;
 ids.forEach(id=>{
  const B=FB(id),days={};
  B.inv.filter(i=>!i.cancelled&&i.pay!=='credit').forEach(i=>{const k=ld(i.date);const d=days[k]=days[k]||{n:0,t:0};d.n++;d.t+=+i.total||0});
  Object.keys(days).forEach(k=>ev.push({date:noon(k),branch:id,kind:'sales',amt:days[k].t,desc:tt('rp.salesDay',{n:days[k].n})}));
  B.exp.forEach(x=>ev.push({date:x.date,branch:id,kind:'exp',amt:-(+x.amount||0),desc:catName(x.category)+(x.note?' — '+x.note:'')}));
  B.pr.forEach(x=>ev.push({date:x.date,branch:id,kind:'sal',amt:-(+x.net||0),desc:(x.name||'')+' · '+(x.month||'')}));
  B.pur.filter(p=>!p.cancelled&&(+p.paid||0)>0).forEach(p=>ev.push({date:p.date,branch:id,kind:'purchase',amt:-(+p.paid||0),desc:'P'+p.no+' · '+(p.supplierName||'')}));
 });
 FIN.pay.forEach(x=>ev.push({date:x.date,branch:'',kind:'suppay',amt:-(+x.amount||0),desc:(x.supplierName||'')+(x.note?' — '+x.note:'')}));
 FIN.rec.forEach(x=>ev.push({date:x.date,branch:'',kind:'collect',amt:+x.amount||0,desc:(x.customer||'')+(x.note?' — '+x.note:'')}));
 ev.sort((a,b)=>a.date.localeCompare(b.date));
 const from=repFrom?dayISO(repFrom):'',to=repTo?dayISO(repTo,true):'9999';
 const cashNow=open+ev.reduce((a,e)=>a+e.amt,0);
 const openAt=open+ev.filter(e=>e.date<from).reduce((a,e)=>a+e.amt,0);
 const inR=ev.filter(e=>e.date>=from&&e.date<to);
 const byKind={};KINDS.forEach(k=>byKind[k]=0);inR.forEach(e=>byKind[e.kind]+=Math.abs(e.amt)*(e.amt<0?-1:1));
 const net=inR.reduce((a,e)=>a+e.amt,0);
 const pays=FIN.sup.map(s=>{
  const pur=ids.flatMap(id=>FB(id).pur.filter(p=>p.supplierId===s.id&&!p.cancelled));
  const total=pur.reduce((a,p)=>a+(+p.total||0),0),paid=pur.reduce((a,p)=>a+(+p.paid||0),0);
  const sp=FIN.pay.filter(x=>x.supplierId===s.id).reduce((a,x)=>a+(+x.amount||0),0),opening=+s.opening||0;
  return {s,opening,total,paid,sp,bal:opening+total-paid-sp};
 });
 const m={};
 ids.forEach(id=>FB(id).inv.filter(i=>!i.cancelled&&i.pay==='credit').forEach(i=>{const k=ckey(i.customer,i.customerPhone);const c=m[k]=m[k]||{key:k,name:i.customer,phone:i.customerPhone||'',credit:0,col:0};c.credit+=+i.total||0}));
 FIN.rec.forEach(r=>{const c=m[r.ckey]=m[r.ckey]||{key:r.ckey,name:r.customer,phone:r.phone||'',credit:0,col:0};c.col+=+r.amount||0});
 const recs=Object.values(m).map(c=>({...c,bal:c.credit-c.col})).sort((a,b)=>b.bal-a.bal);
 const stock=ids.reduce((a,id)=>a+P(id).reduce((x,p)=>x+(+p.qty||0)*(+p.cost||0),0),0);
 const recv=recs.reduce((a,c)=>a+c.bal,0),payb=pays.reduce((a,p)=>a+p.bal,0);
 return {ids,ev,inR,open,openAt,cashNow,byKind,net,close:openAt+net,pays,recs,stock,recv,payb,assets:cashNow+stock+recv,equity:cashNow+stock+recv-payb};
}

async function savePurchase(){
 const bid=S.cur,sup=FIN.sup.find(x=>x.id===pf.sup);
 if(!sup)return alert(tt('pu.noSupplier'));
 const lines=pf.lines.filter(l=>l.pid&&+l.qty>0&&l.cost!==''&&+l.cost>=0).map(l=>{const p=P(bid).find(x=>x.id===l.pid)||{};return {pid:l.pid,name:p.name||'',code:p.code||'',color:(l.color||'').trim(),qty:+l.qty,cost:+l.cost}});
 if(!lines.length)return alert(tt('pu.noLines'));
 const total=lines.reduce((a,l)=>a+l.qty*l.cost,0),paid=pf.paid===''?0:+pf.paid;
 if(!(paid>=0)||paid>total+1e-9)return alert(tt('pu.badPaid'));
 const date=noon(pf.date||todayStr()),no=Math.max(0,...FB(bid).pur.map(p=>+p.no||0))+1;
 try{
  await db.runTransaction(async tx=>{
   const groups={};lines.forEach(l=>(groups[l.pid]=groups[l.pid]||[]).push(l));
   const snaps=[];
   for(const pid of Object.keys(groups)){
    const r=db.doc(`branches/${bid}/products/${pid}`),s=await tx.get(r);
    if(!s.exists)throw new Error(tt('s.noItem',{n:groups[pid][0].name}));
    snaps.push([r,s.data(),groups[pid]]);
   }
   snaps.forEach(([r,p,ls])=>{
    const colors=(p.colors||[]).map(x=>({n:x.n,q:+x.q||0}));
    let qty=+p.qty||0,aq=0,av=0;
    ls.forEach(l=>{
     aq+=l.qty;av+=l.qty*l.cost;
     if(colors.length){
      if(!l.color)throw new Error(tt('f.colorNeedName'));
      const ex=colors.find(x=>x.n.toLowerCase()===l.color.toLowerCase());
      if(ex)ex.q+=l.qty;else colors.push({n:l.color,q:l.qty});
     }
    });
    const cost=Math.round((qty>0?(qty*(+p.cost||0)+av)/(qty+aq):av/aq)*100)/100;
    tx.update(r,colors.length?{colors,qty:sumColors(colors),cost}:{qty:qty+aq,cost});
    ls.forEach(l=>log(tx,bid,'purchase',p.name,l.qty,'P'+no+' · '+sup.name+(colors.length?' · '+l.color:'')));
   });
   tx.set(db.collection(`branches/${bid}/purchases`).doc(),{no,date,supplierId:sup.id,supplierName:sup.name,items:lines,total,paid,method:pf.method,note:(pf.note||'').trim(),by:me.email,branch:bid,cancelled:false});
  });
  pf={sup:pf.sup,date:'',paid:'',method:'cash',note:'',lines:[{pid:'',color:'',qty:'',cost:''}]};
  loadFin();
 }catch(e){alert(errMsg(e))}
}
async function cancelPurchase(bid,id){

 try{
  await db.runTransaction(async tx=>{
   const pref=db.doc(`branches/${bid}/purchases/${id}`),ps=await tx.get(pref);
   if(!ps.exists)throw new Error(tt('i.notFound'));
   const pu=ps.data();if(pu.cancelled)throw new Error(tt('i.already'));
   const groups={};(pu.items||[]).forEach(l=>(groups[l.pid]=groups[l.pid]||[]).push(l));
   const snaps=[];
   for(const pid of Object.keys(groups)){const r=db.doc(`branches/${bid}/products/${pid}`);snaps.push([r,await tx.get(r),groups[pid]])}
   snaps.forEach(([r,s,ls])=>{
    if(!s.exists)return;
    const p=s.data(),colors=(p.colors||[]).map(x=>({n:x.n,q:+x.q||0}));let qty=+p.qty||0;
    ls.forEach(l=>{
     if(colors.length){const ex=colors.find(x=>x.n===(l.color||'—'));if(!ex||ex.q<l.qty)throw new Error(tt('pu.rev',{n:p.name}));ex.q-=l.qty}
     else{if(qty<l.qty)throw new Error(tt('pu.rev',{n:p.name}));qty-=l.qty}
    });
    tx.update(r,colors.length?{colors,qty:sumColors(colors)}:{qty});
    ls.forEach(l=>log(tx,bid,'cancel',p.name,-l.qty,'P'+pu.no+(l.color?' · '+l.color:'')));
   });
   tx.update(pref,{cancelled:true,cancelledBy:me.email,cancelledAt:new Date().toISOString()});
  });
  loadFin();
 }catch(e){alert(errMsg(e))}
}

const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
 const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 files.forEach(f=>{
  const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
  const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);
  lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
  const ch=new DataView(new ArrayBuffer(46));
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);
  ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,off,true);
  parts.push(new Uint8Array(lh.buffer),nm,f.data);cen.push(new Uint8Array(ch.buffer),nm);
  off+=30+nm.length+sz;
 });
 const cdSize=cen.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));
 end.setUint32(0,0x06054b50,true);end.setUint16(4,0,true);end.setUint16(6,0,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);end.setUint16(20,0,true);
 return new Blob([...parts,...cen,new Uint8Array(end.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function xlsxBlob(title,sections){
 const enc=new TextEncoder(),X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n',used={};
 const sheets=(sections.length?sections:[{name:'Sheet',head:[],rows:[]}]).map((s,i)=>{
  let nm=String(s.name||'Sheet'+(i+1)).replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,31)||'Sheet'+(i+1);
  while(used[nm.toLowerCase()])nm=nm.slice(0,28)+'~'+(i+1);

function saveBr(){
 const b=db.batch();
 Object.keys(S.branches).forEach(id=>b.update(db.doc('branches/'+id),{name:document.getElementById('bn_'+id).value.trim()||id,prefix:document.getElementById('bp_'+id).value.trim()}));
 fire(b.commit().then(()=>alert(tt('set.saved'))));

async function addUser(){
 const e=document.getElementById('ue').value.trim().toLowerCase(),p=document.getElementById('up').value,br=document.getElementById('ub').value,nm=(document.getElementById('un').value||'').trim();
 if(!e||!p)return alert(tt('set.needEmailPass'));
 if(e===ADMIN_EMAIL.toLowerCase())return alert(tt('set.isAdminMail'));
 try{
  const sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FB_CONFIG,'sec');
  try{await sec.auth().createUserWithEmailAndPassword(e,p);await sec.auth().signOut()}
  catch(x){if(x.code!=='auth/email-already-in-use')throw x}
  await db.doc('users/'+e).set({email:e,branch:br,name:nm});
  document.getElementById('ue').value='';document.getElementById('up').value='';document.getElementById('un').value='';
  alert(tt('set.userAdded'));
 }catch(x){alert(authErr(x))}
}
function rmUser(e){if(confirm(tt('set.revokeConfirm',{e})))fire(db.doc('users/'+e).delete())}
function backup(){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify({settings:S.settings,branches:S.branches,data:D})],{type:'application/json'}));
 a.download='backup-online-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
async function legacyImport(f){
 if(!f)return;
 let d;try{d=JSON.parse(await f.text())}catch(e){return alert(tt('set.badFile'))}
 const ids=Object.keys(S.branches).sort(),sets=[];
 if(Array.isArray(d.branches))d.branches.forEach((b,i)=>{if(ids[i]&&b&&b.products)sets.push([ids[i],b])});
 else if(d.products)sets.push([S.cur,d]);
 if(!sets.length)return alert(tt('set.badFile'));
 const sum=sets.map(([id,b])=>tt('set.impLine',{b:bname(id),p:(b.products||[]).length,i:(b.invoices||[]).length})).join('\n');
 if(!confirm(tt('set.importConfirm',{s:sum})))return;
 const ops=[];
 for(const [id,b] of sets){
  (b.products||[]).forEach(p=>ops.push(w=>w.set(db.doc(`branches/${id}/products/${p.id}`),{name:p.name,code:p.code||'',cost:+p.cost||0,price:+p.price||0,qty:+p.qty||0,min:+p.min||0,colors:[]})));
  (b.invoices||[]).forEach(i=>ops.push(w=>w.set(db.doc(`branches/${id}/invoices/${i.id}`),{...i,pre:i.pre??(S.branches[id].prefix||''),branch:i.branch||bname(id),cancelled:false,by:me.email})));
  ops.push(w=>w.update(db.doc('branches/'+id),{counter:Math.max(+b.counter||1,S.branches[id].counter||1)}));
 }
 try{
  for(let k=0;k<ops.length;k+=400){const bt=db.batch();ops.slice(k,k+400).forEach(o=>o(bt));await bt.commit()}
  alert(tt('set.imported'));
 }catch(e){alert(errMsg(e))}
}
